name: QA Automation (UI + API)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install deps
      run: npm ci

    - name: Install browsers
      run: npx playwright install --with-deps

    - name: Run UI tests
      run: npm run test:ui

    - name: Run API tests
      run: npm run test:api

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/